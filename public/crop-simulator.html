<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crop Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
  h1 { text-align: center; margin-bottom: 16px; color: #667eea; }
  .row { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
  .box { text-align: center; }
  .box h3 { margin-bottom: 8px; font-size: 14px; color: #aaa; }
  canvas { border: 2px solid #333; border-radius: 8px; background: #000; }
  .controls { text-align: center; margin-bottom: 20px; }
  .controls label { margin: 0 12px; font-size: 14px; }
  .controls input[type=range] { width: 200px; vertical-align: middle; }
  .controls .val { color: #667eea; font-weight: bold; min-width: 40px; display: inline-block; }
  .info { text-align: center; font-size: 13px; color: #888; margin-top: 12px; }
  .info span { color: #667eea; }
  #uploadArea { border: 2px dashed #444; border-radius: 12px; padding: 40px; text-align: center; margin: 0 auto 20px; max-width: 500px; cursor: pointer; transition: border-color 0.2s; }
  #uploadArea:hover { border-color: #667eea; }
  #uploadArea p { color: #888; }
  #uploadArea input { display: none; }
</style>
</head>
<body>

<h1>Face Crop Simulator</h1>

<div id="uploadArea" onclick="document.getElementById('fileInput').click()">
  <p>Click or drop an image here</p>
  <input type="file" id="fileInput" accept="image/*">
</div>

<div class="controls">
  <label>Face Fill:
    <input type="range" id="fillPct" min="50" max="100" value="80" step="1">
    <span class="val" id="fillVal">80%</span>
  </label>
  <label>Landmark Padding:
    <input type="range" id="padPct" min="0" max="50" value="15" step="1">
    <span class="val" id="padVal">15%</span>
  </label>
</div>
<div class="controls">
  <label>Crop Override (0=auto):
    <input type="range" id="cropOverride" min="0" max="1000" value="0" step="5">
    <span class="val" id="cropVal">auto</span>
  </label>
</div>

<div class="row">
  <div class="box">
    <h3>Original + Detection</h3>
    <canvas id="cvsOriginal" width="400" height="400"></canvas>
  </div>
  <div class="box">
    <h3>Cropped Result (600x600)</h3>
    <canvas id="cvsResult" width="300" height="300"></canvas>
  </div>
</div>

<div class="info" id="info">Upload an image to start</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<script>
const DETECT_SIZE = 512;
let uploadedImage = null;
let modelsReady = false;

(async () => {
  try {
    await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/');
    await faceapi.nets.faceLandmark68TinyNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/');
    modelsReady = true;
    document.getElementById('info').textContent = 'Models loaded — upload an image';
    console.log('Models loaded');
  } catch (err) {
    document.getElementById('info').textContent = 'Failed to load models: ' + err.message;
    console.error(err);
  }
})();

document.getElementById('fillPct').addEventListener('input', e => {
  document.getElementById('fillVal').textContent = e.target.value + '%';
  if (uploadedImage) processImage(uploadedImage);
});
document.getElementById('padPct').addEventListener('input', e => {
  document.getElementById('padVal').textContent = e.target.value + '%';
  if (uploadedImage) processImage(uploadedImage);
});
document.getElementById('cropOverride').addEventListener('input', e => {
  document.getElementById('cropVal').textContent = e.target.value == 0 ? 'auto' : e.target.value + 'px';
  if (uploadedImage) processImage(uploadedImage);
});

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => { uploadedImage = img; processImage(img); };
  img.src = URL.createObjectURL(file);
});

// Drag and drop
const area = document.getElementById('uploadArea');
area.addEventListener('dragover', e => { e.preventDefault(); area.style.borderColor = '#667eea'; });
area.addEventListener('dragleave', () => { area.style.borderColor = '#444'; });
area.addEventListener('drop', e => {
  e.preventDefault();
  area.style.borderColor = '#444';
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => { uploadedImage = img; processImage(img); };
  img.src = URL.createObjectURL(file);
});

async function processImage(source) {
  if (!modelsReady) {
    document.getElementById('info').textContent = 'Loading models, please wait...';
    return;
  }
  const srcW = source.naturalWidth || source.width;
  const srcH = source.naturalHeight || source.height;
  const fillPct = parseInt(document.getElementById('fillPct').value) / 100;
  const padPct = parseInt(document.getElementById('padPct').value) / 100;

  // Draw original on left canvas (scaled to fit 400x400)
  const origCvs = document.getElementById('cvsOriginal');
  const origCtx = origCvs.getContext('2d');
  origCtx.clearRect(0, 0, 400, 400);
  const fitScale = Math.min(400 / srcW, 400 / srcH);
  const fitW = srcW * fitScale;
  const fitH = srcH * fitScale;
  origCtx.drawImage(source, (400 - fitW) / 2, (400 - fitH) / 2, fitW, fitH);

  // Detect face on downscaled canvas
  const detectCanvas = document.createElement('canvas');
  const scale = DETECT_SIZE / Math.max(srcW, srcH);
  detectCanvas.width = Math.round(srcW * scale);
  detectCanvas.height = Math.round(srcH * scale);
  const dCtx = detectCanvas.getContext('2d');
  dCtx.drawImage(source, 0, 0, detectCanvas.width, detectCanvas.height);

  let faceRegion = null;
  try {
    const detections = await faceapi
      .detectAllFaces(detectCanvas, new faceapi.TinyFaceDetectorOptions({ inputSize: 512, scoreThreshold: 0.4 }))
      .withFaceLandmarks(true);

    if (detections.length > 0) {
      const det = detections.reduce((a, b) => a.detection.box.area > b.detection.box.area ? a : b);
      const positions = det.landmarks.positions;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of positions) {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }
      const tightW = maxX - minX;
      const tightH = maxY - minY;
      const padX = tightW * padPct;
      const padY = tightH * padPct;

      faceRegion = {
        x: (minX - padX) / scale,
        y: (minY - padY) / scale,
        width: (tightW + padX * 2) / scale,
        height: (tightH + padY * 2) / scale
      };

      // Draw detection box on original canvas (green)
      const rx = (400 - fitW) / 2;
      const ry = (400 - fitH) / 2;
      origCtx.strokeStyle = '#48bb78';
      origCtx.lineWidth = 2;
      origCtx.strokeRect(
        rx + faceRegion.x * fitScale,
        ry + faceRegion.y * fitScale,
        faceRegion.width * fitScale,
        faceRegion.height * fitScale
      );

      // Draw crop region (red dashed)
      const overrideCrop = parseInt(document.getElementById('cropOverride').value);
      const autoCrop = Math.max(faceRegion.width, faceRegion.height) / fillPct;
      const cropSize = overrideCrop > 0 ? overrideCrop : autoCrop;
      const cx = faceRegion.x + faceRegion.width / 2;
      const cy = faceRegion.y + faceRegion.height / 2;
      let sx = cx - cropSize / 2;
      let sy = cy - cropSize / 2;
      if (sx < 0) sx = 0;
      if (sy < 0) sy = 0;
      if (sx + cropSize > srcW) sx = srcW - cropSize;
      if (sy + cropSize > srcH) sy = srcH - cropSize;
      sx = Math.max(0, sx);
      sy = Math.max(0, sy);

      origCtx.setLineDash([6, 4]);
      origCtx.strokeStyle = '#e53e3e';
      origCtx.lineWidth = 2;
      origCtx.strokeRect(rx + sx * fitScale, ry + sy * fitScale, cropSize * fitScale, cropSize * fitScale);
      origCtx.setLineDash([]);

      // Draw cropped result
      const outCvs = document.getElementById('cvsResult');
      const outCtx = outCvs.getContext('2d');
      outCtx.clearRect(0, 0, 300, 300);
      outCtx.drawImage(source, sx, sy, cropSize, cropSize, 0, 0, 300, 300);

      document.getElementById('info').innerHTML =
        `Source: <span>${srcW}x${srcH}</span> | ` +
        `Face region: <span>${Math.round(faceRegion.width)}x${Math.round(faceRegion.height)}</span> | ` +
        `Crop: <span>${Math.round(cropSize)}x${Math.round(cropSize)}</span> | ` +
        `Face fill: <span>${Math.round(faceRegion.height / cropSize * 100)}%</span>`;
    }
  } catch (err) {
    document.getElementById('info').textContent = 'Detection failed: ' + err.message;
    console.error(err);
  }
}
</script>
</body>
</html>
